version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: personal-finance-db
    restart: always
    environment:
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
